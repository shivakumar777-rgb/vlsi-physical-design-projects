<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Arial, sans-serif">
  <rect width="900" height="220" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Clock divider chain (clk1 → ÷2 → ÷4 → ÷8)</text>
  <g stroke="#333" stroke-width="2" fill="#e8f1ff">
    <rect x="20"  y="80" width="120" height="60" rx="8" fill="#fff3d6"/>
    <rect x="200" y="80" width="130" height="60" rx="8"/>
    <rect x="400" y="80" width="130" height="60" rx="8"/>
    <rect x="600" y="80" width="130" height="60" rx="8"/>
    <rect x="780" y="80" width="100" height="60" rx="8" fill="#e6f7e6"/>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)">
    <line x1="140" y1="110" x2="198" y2="110"/>
    <line x1="330" y1="110" x2="398" y2="110"/>
    <line x1="530" y1="110" x2="598" y2="110"/>
    <line x1="730" y1="110" x2="778" y2="110"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#222">
    <text x="80"  y="116">clk1</text>
    <text x="265" y="105">Stage 1</text><text x="265" y="125">÷2</text>
    <text x="465" y="105">Stage 2</text><text x="465" y="125">÷2 (÷4 total)</text>
    <text x="665" y="105">Stage 3</text><text x="665" y="125">÷2 (÷8 total)</text>
    <text x="830" y="116">Flops</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#0a5">
    <text x="80"  y="70">create_clock</text>
    <text x="365" y="165">clk_div2</text>
    <text x="565" y="165">clk_div4</text>
    <text x="755" y="165">clk_div8</text>
  </g>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">Each divider output needs create_generated_clock with the previous stage as -source</text>
</svg>

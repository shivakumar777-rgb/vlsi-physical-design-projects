<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Arial, sans-serif">
  <rect width="900" height="300" fill="#fff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/></marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Half-cycle path vs full-cycle path</text>
  <text x="60" y="130" font-size="16" fill="#222">clk</text>
  <polyline fill="none" stroke="#2b5c8a" stroke-width="3"
    points="100,150 100,100 340,100 340,150 580,150 580,100 820,100"/>
  <g stroke="#999" stroke-dasharray="5,4" stroke-width="1.5">
    <line x1="100" y1="70" x2="100" y2="260"/>
    <line x1="340" y1="70" x2="340" y2="260"/>
    <line x1="580" y1="70" x2="580" y2="260"/>
  </g>
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="100" y="62">launch (rise) t = 0</text>
    <text x="340" y="62">fall edge  T/2</text>
    <text x="580" y="62">rise edge  T</text>
  </g>
  <line x1="100" y1="195" x2="336" y2="195" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <text x="220" y="188" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">half-cycle: logic gets T/2</text>
  <line x1="100" y1="235" x2="576" y2="235" stroke="#1e8449" stroke-width="3" marker-end="url(#b)"/>
  <text x="340" y="228" text-anchor="middle" font-size="14" fill="#1e8449" font-weight="bold">full-cycle: logic gets T</text>
  <text x="450" y="285" text-anchor="middle" font-size="12" fill="#555">Capture on falling edge = half-cycle path. Capture on next rising edge = full-cycle path.</text>
</svg>
